[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filinglens"
version = "0.1.0"
description = "Local, source-grounded SEC filing intelligence and deterministic financial analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FilingLens Project"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "plotly>=5.22,<7",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
